AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Site ipirangaredutores.com.br: DNS (Route 53), certificado HTTPS (ACM), arquivos (S3),
  CDN (CloudFront) e permissão de publicação para o GitHub Actions.
  Criar na região us-east-1 (Norte da Virgínia), exigida pelo certificado do CloudFront.

Parameters:
  Fase:
    Type: String
    AllowedValues: ['1', '2', '3']
    Default: '1'
    Description: >-
      1 = cria só a zona de DNS, ainda apontando para o site antigo (depois troque os servidores DNS no Registro.br).
      2 = cria certificado, bucket e CloudFront; o domínio continua no site antigo e o novo pode ser testado pelo endereço do CloudFront.
      3 = aponta o domínio para o site novo.
  Dominio:
    Type: String
    Default: ipirangaredutores.com.br
  IpSiteAntigo:
    Type: String
    Default: 108.167.132.137
    Description: IP da hospedagem antiga, usado nas fases 1 e 2.
  RepositorioGitHub:
    Type: String
    Default: william-wagner/ipiranga-site
  CriarProvedorOidcGitHub:
    Type: String
    AllowedValues: ['sim', 'nao']
    Default: 'sim'
    Description: Use "nao" se a conta já tiver o provedor token.actions.githubusercontent.com no IAM.

Conditions:
  Fase2: !Not [!Equals [!Ref Fase, '1']]   # fases 2 e 3: infraestrutura existe
  Fase3: !Equals [!Ref Fase, '3']          # domínio aponta para o site novo
  DominioAntigo: !Not [!Condition Fase3]
  CriarOidc: !And [!Condition Fase2, !Equals [!Ref CriarProvedorOidcGitHub, 'sim']]

Resources:
  # ---------- DNS ----------
  Zona:
    Type: AWS::Route53::HostedZone
    Properties:
      Name: !Ref Dominio
      HostedZoneConfig:
        Comment: Site da Ipiranga Redutores

  RegistroRaiz:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref Zona
      Name: !Ref Dominio
      Type: A
      TTL: !If [DominioAntigo, '300', !Ref AWS::NoValue]
      ResourceRecords: !If [DominioAntigo, [!Ref IpSiteAntigo], !Ref AWS::NoValue]
      AliasTarget: !If
        - Fase3
        - { DNSName: !GetAtt Distribuicao.DomainName, HostedZoneId: Z2FDTNDATAQYW2 }
        - !Ref AWS::NoValue

  RegistroWww:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref Zona
      Name: !Sub www.${Dominio}
      Type: A
      TTL: !If [DominioAntigo, '300', !Ref AWS::NoValue]
      ResourceRecords: !If [DominioAntigo, [!Ref IpSiteAntigo], !Ref AWS::NoValue]
      AliasTarget: !If
        - Fase3
        - { DNSName: !GetAtt Distribuicao.DomainName, HostedZoneId: Z2FDTNDATAQYW2 }
        - !Ref AWS::NoValue

  RegistroRaizIpv6:
    Type: AWS::Route53::RecordSet
    Condition: Fase3
    Properties:
      HostedZoneId: !Ref Zona
      Name: !Ref Dominio
      Type: AAAA
      AliasTarget: { DNSName: !GetAtt Distribuicao.DomainName, HostedZoneId: Z2FDTNDATAQYW2 }

  RegistroWwwIpv6:
    Type: AWS::Route53::RecordSet
    Condition: Fase3
    Properties:
      HostedZoneId: !Ref Zona
      Name: !Sub www.${Dominio}
      Type: AAAA
      AliasTarget: { DNSName: !GetAtt Distribuicao.DomainName, HostedZoneId: Z2FDTNDATAQYW2 }

  # ---------- HTTPS ----------
  Certificado:
    Type: AWS::CertificateManager::Certificate
    Condition: Fase2
    Properties:
      DomainName: !Ref Dominio
      SubjectAlternativeNames: [!Sub 'www.${Dominio}']
      ValidationMethod: DNS
      DomainValidationOptions:
        - { DomainName: !Ref Dominio, HostedZoneId: !Ref Zona }
        - { DomainName: !Sub 'www.${Dominio}', HostedZoneId: !Ref Zona }

  # ---------- Arquivos do site ----------
  Bucket:
    Type: AWS::S3::Bucket
    Condition: Fase2
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub site-ipiranga-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }

  PoliticaBucket:
    Type: AWS::S3::BucketPolicy
    Condition: Fase2
    Properties:
      Bucket: !Ref Bucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: SomenteCloudFront
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub '${Bucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribuicao}'

  # ---------- CDN ----------
  ControleAcessoOrigem:
    Type: AWS::CloudFront::OriginAccessControl
    Condition: Fase2
    Properties:
      OriginAccessControlConfig:
        Name: !Sub oac-site-ipiranga-${AWS::AccountId}
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FuncaoRedirects:
    Type: AWS::CloudFront::Function
    Condition: Fase2
    Properties:
      Name: ipiranga-redirects
      AutoPublish: true
      FunctionConfig:
        Comment: www para dominio, redirects do site antigo e index.html
        Runtime: cloudfront-js-2.0
      FunctionCode: |
            // CloudFront Function (runtime cloudfront-js-2.0), evento "viewer request".
            // 1. Manda www.ipirangaredutores.com.br para o domínio sem www
            //    (o endereço *.cloudfront.net continua acessível para testes).
            // 2. Redireciona (301) os endereços do site antigo em WordPress para as páginas novas,
            //    preservando o posicionamento no Google.
            // 3. Converte /pagina/ em /pagina/index.html, que é como os arquivos estão no S3.

            var DOMINIO = 'ipirangaredutores.com.br';

            var REDIRECTS = {
              '/2014/09/24/o-que-e-um-redutor-de-velocidade/': '/o-que-e-um-redutor-de-velocidade/',
              '/2014/10/29/redutor-de-velocidade-esferico/': '/o-que-e-um-redutor-de-velocidade/',
              '/2014/10/29/redutor-epicicloidal/': '/o-que-e-um-redutor-de-velocidade/',
              '/2014/11/05/linha-de-redutores-alumag/': '/produtos/alumag/',
              '/2014/11/05/motorredutor-conimax/': '/produtos/conimax/',
              '/2014/11/05/motorredutor-magmax/': '/produtos/magmax/',
              '/2014/11/05/redutor-coaxial/': '/produtos/coaxial/',
              '/2014/11/05/redutor-vertimax/': '/produtos/vertimax/',
              '/2014/11/05/redutores-helimax-bipartido/': '/produtos/helimax-bipartido/',
              '/2014/11/06/redutores-helimax-1-estagio/': '/produtos/helimax-1-estagio/',
              '/2014/11/06/redutores-helimax-monobloco/': '/produtos/helimax-monobloco/',
              '/2014/11/07/redutor-de-velocidade-magma-k/': '/produtos/magma-k/',
              '/2014/11/07/redutor-de-velocidade-magma-m/': '/produtos/magma-m/',
              '/fale-com-a-ipiranga-redutores/': '/contato/',
              '/redutor-de-velocidade/': '/empresa/',
              '/redutor-de-velocidade-bh/': '/manutencao/',
              '/redutores-de-velocidade/': '/produtos/',
              '/redutores-de-velocidade-bh/': '/aplicacoes/',
            };

            // Prefixos de páginas automáticas do WordPress (categorias, tags, paginação, feed)
            var PREFIXOS = [
              ['/category/', '/produtos/'],
              ['/tag/', '/produtos/'],
              ['/page/', '/produtos/'],
              ['/author/', '/'],
              ['/feed/', '/'],
              ['/comments/', '/'],
              ['/wp-', '/'],
            ];

            function redirecionar(destino) {
              return {
                statusCode: 301,
                statusDescription: 'Moved Permanently',
                headers: { location: { value: destino }, 'cache-control': { value: 'max-age=86400' } },
              };
            }

            function handler(event) {
              var req = event.request;
              var host = req.headers.host ? req.headers.host.value : DOMINIO;
              var uri = req.uri;

              if (host === 'www.' + DOMINIO) {
                var qs = req.querystring && Object.keys(req.querystring).length ? '?' + Object.keys(req.querystring).map(function (k) {
                  return k + '=' + req.querystring[k].value;
                }).join('&') : '';
                return redirecionar('https://' + DOMINIO + uri + qs);
              }

              var chave = uri.endsWith('/') || uri.indexOf('.') !== -1 ? uri : uri + '/';
              if (REDIRECTS[chave]) return redirecionar(REDIRECTS[chave]);
              for (var i = 0; i < PREFIXOS.length; i++) {
                if (uri.indexOf(PREFIXOS[i][0]) === 0) return redirecionar(PREFIXOS[i][1]);
              }
              // Endereços antigos com ?p=123 (links curtos do WordPress)
              if (uri === '/' && req.querystring && req.querystring.p) return redirecionar('/');

              if (uri.endsWith('/')) {
                req.uri = uri + 'index.html';
              } else if (uri.lastIndexOf('.') < uri.lastIndexOf('/') || uri.indexOf('.') === -1) {
                return redirecionar(uri + '/');
              }
              return req;
            }

  Distribuicao:
    Type: AWS::CloudFront::Distribution
    Condition: Fase2
    Properties:
      DistributionConfig:
        Comment: Site da Ipiranga Redutores
        Enabled: true
        Aliases: [!Ref Dominio, !Sub 'www.${Dominio}']
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_All   # inclui os servidores da América do Sul
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificado
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: s3-site
            DomainName: !GetAtt Bucket.RegionalDomainName
            OriginAccessControlId: !GetAtt ControleAcessoOrigem.Id
            S3OriginConfig: { OriginAccessIdentity: '' }
        DefaultCacheBehavior:
          TargetOriginId: s3-site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD]
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6   # Managed-CachingOptimized
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt FuncaoRedirects.FunctionMetadata.FunctionARN
        CustomErrorResponses:
          - { ErrorCode: 403, ResponseCode: 404, ResponsePagePath: /404.html, ErrorCachingMinTTL: 60 }
          - { ErrorCode: 404, ResponseCode: 404, ResponsePagePath: /404.html, ErrorCachingMinTTL: 60 }

  # ---------- Publicação pelo GitHub Actions (OIDC, sem chaves) ----------
  ProvedorOidcGitHub:
    Type: AWS::IAM::OIDCProvider
    Condition: CriarOidc
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  PapelPublicacao:
    Type: AWS::IAM::Role
    Condition: Fase2
    Properties:
      RoleName: github-publicar-site-ipiranga
      Description: Usado pelo GitHub Actions do repositório do site para publicar no S3 e limpar o cache
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub 'arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub 'repo:${RepositorioGitHub}:ref:refs/heads/main'
      Policies:
        - PolicyName: publicar-site
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:ListBucket]
                Resource: !GetAtt Bucket.Arn
              - Effect: Allow
                Action: [s3:PutObject, s3:DeleteObject, s3:GetObject]
                Resource: !Sub '${Bucket.Arn}/*'
              - Effect: Allow
                Action: [cloudfront:CreateInvalidation]
                Resource: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribuicao}'

Outputs:
  ServidoresDNS:
    Description: Coloque estes 4 servidores no Registro.br (sem o ponto final)
    Value: !Join [', ', !GetAtt Zona.NameServers]
  AWSROLEARN:
    Condition: Fase2
    Description: Variável AWS_ROLE_ARN do repositório no GitHub
    Value: !GetAtt PapelPublicacao.Arn
  S3BUCKET:
    Condition: Fase2
    Description: Variável S3_BUCKET do repositório no GitHub
    Value: !Ref Bucket
  CLOUDFRONTDISTRIBUTIONID:
    Condition: Fase2
    Description: Variável CLOUDFRONT_DISTRIBUTION_ID do repositório no GitHub
    Value: !Ref Distribuicao
  EnderecoCloudFront:
    Condition: Fase2
    Description: Endereço de teste do site (funciona antes da virada do domínio)
    Value: !Sub 'https://${Distribuicao.DomainName}'
