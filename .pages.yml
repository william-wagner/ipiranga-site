# Configuração do painel de edição (Pages CMS: https://app.pagescms.org)
# Cada "Salvar" no painel vira um commit na main e o site é publicado sozinho.

media:
  input: public/images
  output: /images

content:
  - name: empresa
    label: Serviços, clientes e setores
    type: file
    path: src/data/empresa.json
    format: json
    fields:
      - name: fundacao
        label: Ano de fundação
        type: number
      - name: servicos
        label: Serviços de manutenção (aparecem na página inicial)
        type: object
        list: true
        fields:
          - { name: nome, label: Serviço, type: string }
          - { name: detalhe, label: Explicação curta (opcional), type: string }
      - name: clientes
        label: Clientes na faixa de logos (página inicial)
        type: object
        list: true
        fields:
          - { name: nome, label: Nome da empresa, type: string }
          - { name: logo, label: "Logo (PNG transparente ou SVG; vazio mostra o espaço reservado)", type: image }
      - name: setores
        label: Setores atendidos
        type: string
        list: true

  - name: contato
    label: Contato e horário
    type: file
    path: src/data/site.json
    format: json
    fields:
      - name: nome
        label: Nome da empresa
        type: string
      - name: telefone
        label: Telefone (como aparece no site)
        type: string
      - name: whatsapp
        label: WhatsApp (só números, com 55 e DDD, ex. 553132015536)
        type: string
      - name: mensagemWhatsapp
        label: Mensagem que já vem escrita no WhatsApp
        type: string
      - name: email
        label: E-mail
        type: string
      - name: endereco
        label: Endereço
        type: string
      - name: bairro
        label: Bairro
        type: string
      - name: cidade
        label: Cidade
        type: string
      - name: cep
        label: CEP
        type: string
      - name: horario
        label: Horário de funcionamento (formato 08:30; deixe vazio quando fechado)
        type: object
        fields:
          - name: semana
            label: Segunda a sexta
            type: object
            fields:
              - { name: abre, label: Abre, type: string }
              - { name: fecha, label: Fecha, type: string }
          - name: sabado
            label: Sábado
            type: object
            fields:
              - { name: abre, label: Abre, type: string }
              - { name: fecha, label: Fecha, type: string }
          - name: domingo
            label: Domingo
            type: object
            fields:
              - { name: abre, label: Abre, type: string }
              - { name: fecha, label: Fecha, type: string }
