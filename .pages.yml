# Configuração do painel de edição (Pages CMS: https://app.pagescms.org)
# Cada "Salvar" no painel vira um commit na main e o site é publicado sozinho.

media:
  input: public/images
  output: /images

content:
  - name: produtos
    label: Produtos
    type: collection
    path: src/content/produtos
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: titulo
      fields: [titulo, tipo]
      sort: ordem
      order: asc
    fields:
      - name: titulo
        label: Nome do produto
        type: string
        required: true
      - name: tipo
        label: Tipo (agrupa os produtos na página)
        type: string
        required: true
      - name: resumo
        label: Resumo (aparece no Google e no topo da página)
        type: text
        required: true
      - name: imagem
        label: Foto
        type: image
      - name: ordem
        label: Ordem na lista (menor aparece primeiro)
        type: number
      - name: especificacoes
        label: Ficha técnica
        type: object
        list: true
        fields:
          - name: item
            label: Característica
            type: string
          - name: valor
            label: Valor
            type: string
      - name: body
        label: Descrição
        type: rich-text

  - name: paginas
    label: Páginas
    type: collection
    path: src/content/paginas
    format: yaml-frontmatter
    view:
      primary: titulo
    fields:
      - name: titulo
        label: Título
        type: string
        required: true
      - name: descricao
        label: Descrição (aparece no Google)
        type: text
        required: true
      - name: imagem
        label: Foto ao lado do texto
        type: image
      - name: body
        label: Texto
        type: rich-text

  - name: contato
    label: Contato e horário
    type: file
    path: src/data/site.json
    format: json
    fields:
      - name: nome
        label: Nome da empresa
        type: string
      - name: telefone
        label: Telefone (como aparece no site)
        type: string
      - name: whatsapp
        label: WhatsApp (só números, com 55 e DDD, ex. 553132015536)
        type: string
      - name: mensagemWhatsapp
        label: Mensagem que já vem escrita no WhatsApp
        type: string
      - name: email
        label: E-mail
        type: string
      - name: endereco
        label: Endereço
        type: string
      - name: bairro
        label: Bairro
        type: string
      - name: cidade
        label: Cidade
        type: string
      - name: cep
        label: CEP
        type: string
      - name: horario
        label: Horário de funcionamento (formato 08:30; deixe vazio quando fechado)
        type: object
        fields:
          - name: semana
            label: Segunda a sexta
            type: object
            fields:
              - { name: abre, label: Abre, type: string }
              - { name: fecha, label: Fecha, type: string }
          - name: sabado
            label: Sábado
            type: object
            fields:
              - { name: abre, label: Abre, type: string }
              - { name: fecha, label: Fecha, type: string }
          - name: domingo
            label: Domingo
            type: object
            fields:
              - { name: abre, label: Abre, type: string }
              - { name: fecha, label: Fecha, type: string }
